version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sync_licensing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sync_licensing
    volumes:
      - db_data:/var/lib/postgresql/data
    # Intentionally no "ports:" - only reachable from other containers on this
    # compose's internal network, never from the host or the public internet.

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://sync_licensing:${POSTGRES_PASSWORD}@db:5432/sync_licensing
      APP_SECRET: ${APP_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      PORT: 4000
    volumes:
      - uploads_data:/app/uploads
    # No "ports:" here either - the web container reaches it as http://server:4000
    # over the internal network; it is never exposed directly.

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Bound to localhost only, on a port that is very unlikely to collide with
      # anything else already running on this server. Your existing reverse proxy
      # (nginx/Caddy/etc. for your other sites) should add a new vhost for your
      # chosen subdomain that forwards to 127.0.0.1:${APP_PORT:-8090} - see
      # deploy/README.md. This compose file never touches ports 80/443 itself.
      - "127.0.0.1:${APP_PORT:-8090}:80"

volumes:
  db_data:
  uploads_data:
