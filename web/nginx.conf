server {
  listen 80;
  server_name _;
  client_max_body_size 500M;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
